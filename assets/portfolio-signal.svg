<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Human-in-the-Loop AI Assignment Grading workflow</title><desc id="desc">Submission moves through structured AI assessment, teacher review, and controlled release.</desc>
  <rect width="1200" height="420" rx="28" fill="#101827"/><text x="56" y="72" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="34" font-weight="700">Human-in-the-Loop AI Assignment Grading</text><text x="56" y="108" fill="#94A3B8" font-family="Arial, sans-serif" font-size="18">AI drafts a structured assessment; the teacher controls the final release.</text>
  <g font-family="Arial, sans-serif"><g fill="#182235" stroke="#38BDF8" stroke-width="2"><rect x="56" y="180" width="210" height="112" rx="16"/><rect x="338" y="180" width="210" height="112" rx="16"/><rect x="620" y="180" width="210" height="112" rx="16"/><rect x="902" y="180" width="210" height="112" rx="16"/></g><g fill="#E2E8F0" font-size="21" font-weight="700" text-anchor="middle"><text x="161" y="224">SUBMITTED</text><text x="443" y="224">AI_ASSESSED</text><text x="725" y="224">TEACHER_REVIEW</text><text x="1007" y="224">RELEASED</text></g><g fill="#94A3B8" font-size="15" text-anchor="middle"><text x="161" y="254">rubric + version</text><text x="443" y="254">schema-validated draft</text><text x="725" y="254">edit / override / note</text><text x="1007" y="254">controlled final grade</text></g><g stroke="#F59E0B" stroke-width="4" fill="none"><path d="M276 236h50"/><path d="M558 236h50"/><path d="M840 236h50"/></g></g>
