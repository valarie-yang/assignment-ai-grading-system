<text x="72" y="156" class="label cyan">LOCAL MVP EVIDENCE</text><text x="72" y="226" class="h1 ink">AI drafts the assessment.</text><text x="72" y="292" class="h1 ink">The teacher owns the grade.</text><text x="72" y="342" class="body muted">Human-in-the-loop AI Assignment Grading · rubric · evidence · review · controlled release</text>
<rect x="930" y="135" width="438" height="220" rx="12" class="p"/><text x="960" y="174" class="label orange">THE PRODUCT DECISION</text><text x="960" y="220" class="h3 ink">Do not optimize for</text><text x="960" y="248" class="h3 ink">“automatic grading”.</text><line x1="960" y1="270" x2="1338" y2="270" class="line"/><text x="960" y="304" class="small muted">Optimize for inspectable evidence,</text><text x="960" y="326" class="small muted">revision and accountable release.</text>
