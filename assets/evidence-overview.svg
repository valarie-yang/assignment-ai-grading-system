font-size="9" fill="#A36C00">NEEDS REVIEW</text><text x="844" y="697" font-family="Inter" font-size="10" fill="#697386">v0.7</text><rect x="296" y="774" width="292" height="116" rx="6" fill="#FFF" stroke="#E1E6EF"/><text x="318" y="800" font-family="Inter" font-size="10" fill="#697386">RUBRIC EVIDENCE</text><text x="318" y="828" font-family="Inter" font-size="12" fill="#1B2333">Argument clarity</text><text x="548" y="828" text-anchor="end" font-family="Inter" font-size="12" font-weight="700" fill="#3656D4">3 / 4</text><line x1="318" y1="842" x2="566" y2="842" stroke="#E1E6EF"/><text x="318" y="868" font-family="Inter" font-size="12" fill="#1B2333">Evidence use</text><text x="548" y="868" text-anchor="end" font-family="Inter" font-size="12" font-weight="700" fill="#3656D4">2 / 4</text><rect x="608" y="774" width="294" height="116" rx="6" fill="#FFFDF4" stroke="#F1D796"/><text x="630" y="800" font-family="Inter" font-size="10" fill="#9A6C13">REVIEW GATE</text><text x="630" y="828" font-family="Inter" font-size="12" fill="#1B2333">AI draft is not final grade</text><text x="630" y="854" font-family="Inter" font-size="10" fill="#697386">Teacher must approve / revise</text><rect x="630" y="866" width="112" height="20" rx="5" fill="#D9E0F8"/><text x="650" y="880" font-family="Inter" font-size="9" fill="#3656D4">OPEN REVIEW</text>
