<g transform="translate(72,1034)"><rect width="300" height="216" rx="10" class="p2"/><text x="22" y="36" class="label orange">MY ROLE</text><text x="22" y="72" class="small ink">Rubric/state model, provider</text><text x="22" y="98" class="small ink">boundary, review and release.</text><text x="22" y="150" class="label dim">RESULT</text><text x="22" y="178" class="small muted">Locally verified offline loop.</text><rect x="324" width="300" height="216" rx="10" class="p2"/><text x="346" y="36" class="label cyan">INPUTS</text><text x="346" y="72" class="small ink">Submission + rubric + model</text><text x="346" y="98" class="small ink">config + versioned state.</text><text x="346" y="150" class="label dim">OUTPUTS</text><text x="346" y="178" class="small muted">Evidence map + draft score + report.</text><rect x="648" width="300" height="216" rx="10" class="p2"/><text x="670" y="36" class="label blue">CONTROL</text><text x="670" y="72" class="small ink">Structured output validation</text><text x="670" y="98" class="small ink">and rule-scoring fallback.</text><text x="670" y="150" class="label dim">HUMAN OWNER</text><text x="670" y="178" class="small muted">Teacher releases final grade.</text><rect x="972" width="396" height="216" rx="10" class="p2"/><text x="994" y="36" class="label red">NOT CLAIMED</text><text x="994" y="72" class="small muted">Autonomous final grade</text><text x="994" y="98" class="small muted">production model quality</text><text x="994" y="124" class="small muted">public source mirror</text><text x="994" y="178" class="tiny dim">/assignment-ai-grading-system</text></g>
<line x1="72" y1="1320" x2="1368" y2="1320" class="line"/><text x="72" y="1370" class="label cyan">END-TO-END STATE MODEL</text><text x="72" y="1422" class="h2 ink">Draft → submitted → AI assessed → teacher review → revised → released</text><g transform="translate(72,1470)"><rect width="180" height="68" rx="8" class="p"/><text x="22" y="42" class="small ink">DRAFT</text><line x1="180" y1="34" x2="212" y2="34" class="line"/><rect x="212" width="180" height="68" rx="8" class="p"/><text x="234" y="42" class="small ink">SUBMITTED</text><line x1="392" y1="34" x2="424" y2="34" class="line"/><rect x="424" width="180" height="68" rx="8" class="p"/><text x="446" y="42" class="small ink">AI ASSESSED</text><line x1="604" y1="34" x2="636" y2="34" class="line"/><rect x="636" width="180" height="68" rx="8" class="p"/><text x="658" y="42" class="small ink">TEACHER REVIEW</text><line x1="816" y1="34" x2="848" y2="34" class="line"/><rect x="848" width="180" height="68" rx="8" class="p"/><text x="870" y="42" class="small ink">REVISED</text><line x1="1028" y1="34" x2="1060" y2="34" class="line"/><rect x="1060" width="180" height="68" rx="8" fill="#193B38" stroke="#2D5B55"/><text x="1082" y="42" class="small green">RELEASED</text></g>
<rect x="72" y="1620" width="1296" height="360" rx="12" class="p"/><text x="102" y="1664" class="label green">RECRUITER WALKTHROUGH · 2 MINUTES</text><text x="102" y="1714" class="small ink">1 · Show the teacher workspace and point out the synthetic record, rubric evidence and NEEDS REVIEW state.</text><text x="102" y="1756" class="small ink">2 · Explain why structured output, model version and fallback rules matter more than a fluent answer.</text><text x="102" y="1798" class="small ink">3 · Click through review → revise → release; the accountable teacher—not the model—owns the final grade.</text><line x1="102" y1="1840" x2="1338" y2="1840" class="line"/><text x="102" y="1882" class="small muted">Evidence level: local MVP verified separately + public-safe documentation package</text><text x="102" y="1922" class="mono cyan">github.com/valarie-yang/assignment-ai-grading-system</text>
